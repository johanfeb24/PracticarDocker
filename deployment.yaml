apiVersion: apps/v1
kind: Deployment
metadata:
  name: password-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: password-api
  template:
    metadata:
      labels:
        app: password-api
    spec:
      containers:
      - name: password-api
        image: johanfeb24/password-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: password-api
spec:
  selector:
    app: password-api
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000